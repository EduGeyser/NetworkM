[versions]
netty = "4.2.20.Final"
junit = "6.1.3"
webrtc-java = "1.0.1-sm.1-SNAPSHOT"
gson = "2.15.0"
nmcp = "1.6.2"
jose4j = "0.9.7"
bouncycastle = "1.86"
slf4j = "2.0.20"
xmlutil = "1.0.2.1"
# Read by the jacoco extensions in the root build
jacoco = "0.8.16"

[libraries]
expiringmap = { group = "net.jodah", name = "expiringmap", version = "0.5.11" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
netty-bom = { group = "io.netty", name = "netty-bom", version.ref = "netty" }
netty-common = { group = "io.netty", name = "netty-common" }
netty-buffer = { group = "io.netty", name = "netty-buffer" }
netty-codec-base = { group = "io.netty", name = "netty-codec-base" }
netty-codec-http = { group = "io.netty", name = "netty-codec-http" }
netty-codec-haproxy = { group = "io.netty", name = "netty-codec-haproxy" }
netty-pkitesting = { group = "io.netty", name = "netty-pkitesting" }
netty-transport = { group = "io.netty", name = "netty-transport" }
netty-transport-native-unix-common = { group = "io.netty", name = "netty-transport-native-unix-common" }
netty-transport-native-epoll = { group = "io.netty", name = "netty-transport-native-epoll" }
webrtc-java = { group = "io.github.sendablemetatype.webrtc", name = "webrtc-java", version.ref = "webrtc-java" }
jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
errorprone-annotations = { group = "com.google.errorprone", name = "error_prone_annotations", version = "2.52.0" }

# Test dependencies
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
jspecify = { group = "org.jspecify", name = "jspecify", version = "1.0.1" }
slf4j-jdk14 = { group = "org.slf4j", name = "slf4j-jdk14", version.ref = "slf4j" }

# Publishing task dependencies
nmcp-task-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version = "5.5.1" }
nmcp-task-okio = { group = "com.squareup.okio", name = "okio", version = "3.18.2" }
nmcp-task-xmlutil-core = { group = "io.github.pdvrieze.xmlutil", name = "core", version.ref = "xmlutil" }
nmcp-task-xmlutil-serialization = { group = "io.github.pdvrieze.xmlutil", name = "serialization", version.ref = "xmlutil" }
nmcp-task-kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version = "2.4.21" }
nmcp-task-annotations = { group = "org.jetbrains", name = "annotations", version = "26.1.0" }


[bundles]
netty = [ "netty-common", "netty-buffer", "netty-codec-base", "netty-transport", "netty-transport-native-unix-common" ]
junit = [ "junit-jupiter-engine", "junit-jupiter-api", "junit-jupiter-params" ]


[plugins]
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
