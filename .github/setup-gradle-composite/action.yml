name: setup-gradle-composite
description: Set up Java and Gradle for the checked-out repository.
runs:
  using: composite
  steps:
    # The JDK the build compiles with; Gradle provisions any other test JDK
    - id: java
      uses: ./.github/newest-java
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: ${{ steps.java.outputs.version }}
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
