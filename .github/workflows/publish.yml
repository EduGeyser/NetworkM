name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven release version
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NETWORK_PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      - uses: ./.github/setup-gradle-composite
      - name: Validate release version
        shell: bash
        run: |
          if [[ -z "$NETWORK_PUBLISH_VERSION" || "$NETWORK_PUBLISH_VERSION" == *-SNAPSHOT ]]; then
            echo 'Provide a non-snapshot release version.' >&2
            exit 1
          fi
      - name: Test
        run: ./gradlew check
      - name: Publish both transports
        run: ./gradlew publishAggregationToCentralPortal
        env:
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
