name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
  # Publish release runs the full matrix on the commit it publishes
  workflow_call:
permissions:
  contents: read
jobs:
  java:
    name: Java versions
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.newest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: newest
        uses: ./.github/newest-java
  build:
    name: ${{ matrix.native }} java${{ matrix.java }}
    needs: java
    strategy:
      # Every lane reports, so one failure does not hide another
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        # The floor, which the artifacts are compiled for (set by hand), and the newest JDK
        java: [25, '${{ needs.java.outputs.newest }}']
        include:
          - os: ubuntu-latest
            native: linux-x86_64
          - os: ubuntu-24.04-arm
            native: linux-aarch64
          - os: windows-latest
            native: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/setup-gradle-composite
      # The nethernet-nxs tests run the NXS specification's Node.js verifiers
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Build and test
        shell: bash
        run: ./gradlew build --warning-mode=fail -PtestJavaVersion=${{ matrix.java }} -PwebrtcNativePlatform=${{ matrix.native }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: networkm-${{ matrix.native }}-java${{ matrix.java }}
          path: |
            transport-common/build/libs/*.jar
            transport-raknet/build/libs/*.jar
            transport-nethernet/build/libs/*.jar
            nethernet-nxs/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.native }}-java${{ matrix.java }}
          path: build/reports/jacoco/testCodeCoverageReport/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-${{ matrix.native }}-java${{ matrix.java }}
          path: |
            */build/test-results/
            */build/reports/tests/
          if-no-files-found: ignore
