name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21, 25, 26]
        include:
          - os: ubuntu-latest
            native: linux-x86_64
          - os: windows-latest
            native: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/setup-gradle-composite
      - name: Build and test both transports
        shell: bash
        run: ./gradlew build -PtestJavaVersion=${{ matrix.java }} -PwebrtcNativePlatform=${{ matrix.native }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: networkm-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            transport-raknet/build/libs/*.jar
            transport-nethernet/build/libs/*.jar
          if-no-files-found: error
