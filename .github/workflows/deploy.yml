on:
  workflow_call:
    inputs:
      deploy-url:
        description: 'The maven repository to deploy to'
        required: true
        type: string
      publish-version:
        description: 'Optional Maven project version override. Use a -SNAPSHOT value to keep Maven timestamped snapshot publishing.'
        required: false
        default: ''
        type: string
    secrets:
      DEPLOY_USERNAME:
        required: true
      DEPLOY_PASSWORD:
        required: true
      PGP_SECRET:
        required: true
      PGP_PASSPHRASE:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/setup-gradle-composite
      - name: Build and test both transports
        run: ./gradlew build
      - name: Publish both transports
        run: ./gradlew publish
        env:
          MAVEN_DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          MAVEN_DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          MAVEN_DEPLOY_URL: ${{ inputs.deploy-url }}
          NETWORK_PUBLISH_VERSION: ${{ inputs.publish-version }}
